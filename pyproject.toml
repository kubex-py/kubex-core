[project]
name = "kubex-core"
version = "0.1.0-beta.6"
description = "Core model types shared by Kubex and its generated resource packages"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT License"}
authors = [
    {name = "Codemageddon", email = "dev@codemageddon.me"},
]
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0.2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Framework :: Pydantic :: 2",
  "Typing :: Typed",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
]

[project.urls]
Homepage = "https://github.com/kubex-py/kubex-core"
Repository = "https://github.com/kubex-py/kubex-core.git"
Issues = "https://github.com/kubex-py/kubex-core/issues"
Changelog = "https://github.com/kubex-py/kubex-core/blob/main/CHANGELOG.md"
Documentation = "https://kubex.codemageddon.me/"

[dependency-groups]
dev = [
    # real generated models for the tests; it depends on kubex-core, which
    # resolves to this project
    "kubex-k8s-1-35",
    "mypy==2.4.0",
    "pre-commit>=4.0.1",
    "pytest>=8.3.3",
    "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["kubex_core"]

[tool.hatch.build.targets.wheel]
packages = ["kubex_core"]

[tool.mypy]
strict = true
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-first-party = ["kubex_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
