name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: kubex-py/.github/.github/workflows/python-ci.yml@main
    with:
      mypy-args: kubex_core tests
